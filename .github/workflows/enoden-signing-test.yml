name: Enoden timetable HTML structural diagnostic
on:
  push:
    branches:
      - enoden-shortcut-build-20261021
  pull_request:
    branches:
      - main
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect last departures and class markup
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          u='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          res=urllib.request.urlopen(req,timeout=20)
          s=res.read().decode('utf-8','replace')
          print('len',len(s),'content-type',res.headers.get('Content-Type'))
          for h in (21,22,23):
              x=f'<div class="time-schedule-td time-schedule-td-hour">{h}</div>'
              i=s.find(x)
              print('HOUR',h,'OFFSET',i,'HTML',s[max(0,i-40):i+1500])
          for k in ('藤沢行き','江ノ島行','time-schedule-minute','time-schedule-row'):
              print(k,'count',s.count(k))
          PY
