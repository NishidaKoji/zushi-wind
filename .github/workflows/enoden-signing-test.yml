name: Enoden native shortcut compile and live HTML tests
on:
  push:
    branches:
      - enoden-shortcut-build-20261021
  pull_request:
    branches:
      - main
jobs:
  inspect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile Apple native shortcut via Cherri
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q --depth 1 https://github.com/electrikmilk/cherri.git /tmp/cherri
          cd /tmp/cherri
          go run . "$GITHUB_WORKSPACE/enoden/next-two.cherri" --debug --no-sign
          ls -lah "$GITHUB_WORKSPACE/enoden/"
      - name: Inspect native workflow for regression and publish versioned signed shortcut
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import plistlib,glob,os
          files=glob.glob('enoden/*修正版.shortcut')
          assert len(files)==1,files
          b=open(files[0],'rb').read()
          print('SIGNED_MAGIC',repr(b[:4]),'SIZE',len(b))
          assert b[:4]==b'AEA1' and len(b)>1000
          p=plistlib.load(open(glob.glob('enoden/*修正版.plist')[0],'rb'))
          actions=p['WFWorkflowActions']
          print('ACTIONS',len(actions),'WATCH',p.get('WFWorkflowTypes'))
          assert 'Watch' in p.get('WFWorkflowTypes',[])
          assert not any(a['WFWorkflowActionIdentifier']=='is.workflow.actions.detect.text' for a in actions), 'unexpected getText conversion remains'
          split=[a for a in actions if a['WFWorkflowActionIdentifier']=='is.workflow.actions.text.split']
          print('FIRST_SPLIT',split[0]['WFWorkflowActionParameters'])
          assert len(split)>=2
          first=split[0]['WFWorkflowActionParameters']['text']['Value']['attachmentsByRange']['{0, 1}']
          assert first['OutputName']=='html', 'first split is not fed explicit HTML text conversion'
          assert any(a['WFWorkflowActionIdentifier']=='is.workflow.actions.gettext' and a['WFWorkflowActionParameters'].get('CustomOutputName')=='html' for a in actions), 'explicit text action not found'
          additions=[]
          for a in actions:
              par=a.get('WFWorkflowActionParameters',{})
              if a['WFWorkflowActionIdentifier']=='is.workflow.actions.math':
                  print('MATH',par.get('WFMathOperation'),par.get('WFInput'),par.get('WFMathOperand'))
                  if par.get('WFMathOperation')=='+': additions.append(par)
          assert len(additions)>=3,'missing addition calculation steps'
          # This catches the old bug that overwrote "now" and "departure".
          for idx,a in enumerate(actions):
              par=a.get('WFWorkflowActionParameters',{})
              if a['WFWorkflowActionIdentifier']=='is.workflow.actions.setvariable' and par.get('WFVariableName') in ('now','departure'):
                  print('SETTING',idx,par.get('WFVariableName'),par['WFInput'])
          assert len(actions)>80,'abnormally short workflow'
          print('SHORTCUT_STATIC_VALIDATION_PASS')
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin enoden-shortcut-build-20261021
          git checkout -B enoden-shortcut-build-20261021 origin/enoden-shortcut-build-20261021
          git add -f "enoden/江ノ電 鎌倉駅 次発2本 修正版.shortcut"
          git commit -m "Publish validated signed Enoden timetable shortcut v2 [skip ci]"
          git push origin HEAD:enoden-shortcut-build-20261021
      - name: Verify timetable HTML structure, destination markings and top-two calculation
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          u='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          s=urllib.request.urlopen(q,timeout=20).read().decode('utf-8','replace')
          stops=[]
          for r in s.split('<div class="time-schedule-row">'):
              h=re.search(r'time-schedule-td-hour">([0-9]{1,2})',r)
              if not h: continue
              hour=int(h.group(1))
              for c in r.split('<div class="time-schedule-minute">')[1:]:
                  m=re.search(r'<p class="num">([0-9]{1,2})</p>',c)
                  if m:
                      destination='江ノ島' if 'num cap">江' in c else ('極楽寺' if 'num cap">極' in c else ('稲村ヶ崎' if 'num cap">稲' in c else '藤沢'))
                      stops.append((hour*60+int(m.group(1)),destination))
          print('Found services:',len(stops),'destinations',sorted(set(x[1] for x in stops)))
          assert len(stops)>2
          assert (22*60+24,'江ノ島') in stops
          assert (23*60+38,'江ノ島') in stops
          assert (22*60+10,'藤沢') in stops
          assert (23*60+5,'藤沢') in stops
          for h,m in [(0,15),(9,59),(22,9),(22,10),(23,40)]:
              now=h*60+m
              upcoming=sorted((((t-now)%1440 or 1440,t,d) for t,d in stops))
              print(f'AT {h:02}:{m:02}:',upcoming[:2])
          PY
