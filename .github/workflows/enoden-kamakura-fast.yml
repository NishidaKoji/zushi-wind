name: Kamakura fast native shortcut build and correctness tests
on:
  push:
    branches: [enoden-shortcut-build-20261021]
    paths:
      - 'enoden/kamakura-next-fast.cherri'
      - '.github/workflows/enoden-kamakura-fast.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign optimized watch shortcut
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q --depth 1 https://github.com/electrikmilk/cherri.git /tmp/cherri
          cd /tmp/cherri
          go run . "$GITHUB_WORKSPACE/enoden/kamakura-next-fast.cherri" --debug --no-sign
      - name: Validate native action parameters and shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib,glob,json
          p=glob.glob('enoden/江ノ電 鎌倉駅 次発2本.plist')
          f=glob.glob('enoden/江ノ電 鎌倉駅 次発2本.shortcut')
          assert len(p)==len(f)==1,(p,f)
          b=open(f[0],'rb').read()
          print('SIGNED',b[:4],len(b))
          assert b[:4]==b'AEA1'
          d=plistlib.load(open(p[0],'rb'))
          a=d['WFWorkflowActions']
          print('ACTIONS',len(a),'TYPES',d.get('WFWorkflowTypes'))
          assert 'Watch' in d.get('WFWorkflowTypes',[])
          assert a[0]['WFWorkflowActionIdentifier']=='is.workflow.actions.downloadurl'
          assert a[0]['WFWorkflowActionParameters']['WFURL']=='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          cond=[]
          for i,x in enumerate(a):
              pp=x.get('WFWorkflowActionParameters',{})
              if x['WFWorkflowActionIdentifier']=='is.workflow.actions.conditional' and pp.get('WFControlFlowMode')==0:
                  op=pp.get('WFCondition')
                  cond.append(op)
                  print('IF',i,op,pp.keys())
                  assert op!=99, 'Bad contains with missing UI field'
                  if op in (0,1,2,3,4,5):
                      assert 'WFNumberValue' in pp,('Numeric IF missing value',i,pp)
                      assert 'WFConditionalActionString' not in pp
                  elif op==100: assert 'WFInput' in pp
                  else: raise AssertionError(('Unexpected IF',i,pp))
          print('IF_OPERATOR_LIST',cond)
          assert len(cond)>=10
          ids=[x['WFWorkflowActionIdentifier'] for x in a]
          assert 'is.workflow.actions.setitemname' in ids
          assert 'is.workflow.actions.detect.text' in ids
          assert ids.count('is.workflow.actions.repeat.each')==2,[(i,n) for i,n in enumerate(ids) if 'repeat' in n]
          assert len(a)<225,('Too many actions',len(a))
          texts=[x.get('WFWorkflowActionParameters',{}).get('Text') for x in a if x['WFWorkflowActionIdentifier']=='is.workflow.actions.showresult']
          assert len(texts)==2
          body=json.dumps(texts,ensure_ascii=False)
          assert '江ノ電 鎌倉駅' in body
          assert '次発2本 v6' not in body
          print('STATIC_SHORTCUT_CHECK_PASS')
          PY
      - name: Cross-check shortcut's early-stop algorithm against full official timetable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.request,datetime
          u='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          page=urllib.request.urlopen(q,timeout=30).read().decode('utf-8','replace')
          rows=page.split('<div class="time-schedule-row">')
          hours=[]
          for row in rows:
              hh=re.search(r'time-schedule-td-hour">([0-9]{1,2})',row)
              if not hh: continue
              h=int(hh.group(1))
              cells=row.split('<div class="time-schedule-minute">')
              minutes=[]
              for cell in cells:
                  mm=re.search(r'<p class="num">([0-9]{1,2})</p>',cell)
                  if not mm: continue
                  m=int(mm.group(1))
                  dest='江ノ島' if re.search(r'<p class="num cap">江</p>',cell) else ('極楽寺' if re.search(r'<p class="num cap">極</p>',cell) else ('稲村ヶ崎' if re.search(r'<p class="num cap">稲</p>',cell) else '藤沢'))
                  minutes.append((m,dest))
              hours.append((h,minutes))
          services=[(h*60+m,dest) for h,mins in hours for m,dest in mins]
          assert len(services)>2
          assert services==sorted(services,key=lambda x:x[0]),'Timetable not chronological'
          print('OFFICIAL_SERVICE_COUNT',len(services),'HOURS',len(hours))
          assert services[0][0]==320 and services[-1][0]==1418
          def optimized(now):
              found=[]
              now_h=now//60
              for h,mins in hours:
                  if len(found)>=2:break
                  if h>=now_h:
                      for m,d in mins:
                          if len(found)>=2:break
                          dep=h*60+m
                          diff=dep-now
                          if diff>0: found.append((diff,dep,d))
              if len(found)<2:
                  for h,mins in hours:
                      if len(found)>=2:break
                      for m,d in mins:
                          if len(found)>=2:break
                          dep=h*60+m
                          diff=dep+1440-now
                          found.append((diff,dep,d))
              return found
          # Exhaustively test each of the 1440 possible current minute-of-day values.
          for now in range(1440):
              actual=optimized(now)
              truth=sorted((((t-now)%1440 or 1440,t,d) for t,d in services))[:2]
              if actual!=truth:raise AssertionError(f'MISMATCH NOW {now//60:02}:{now%60:02} computed={actual} correct={truth}')
          print('ALL_1440_MINUTES_PASS')
          for h,m in [(0,5),(5,19),(6,14),(12,39),(21,59),(22,26),(23,39)]:
              print('SAMPLE',f'{h:02}:{m:02}',optimized(h*60+m))
          PY
      - name: Publish signed file only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin enoden-shortcut-build-20261021
          git checkout -B enoden-shortcut-build-20261021 origin/enoden-shortcut-build-20261021
          git add -f "enoden/江ノ電 鎌倉駅 次発2本.shortcut"
          git commit -m "Publish optimized native Kamakura next-two shortcut [skip ci]"
          git push origin HEAD:enoden-shortcut-build-20261021
          echo "OPTIMIZED_SIGNED_SHORTCUT_PUBLISHED=true"
