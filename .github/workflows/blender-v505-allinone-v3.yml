          #!/usr/bin/env python3
          import bpy
          import sys
          import argparse
          import hashlib
          import json
          from pathlib import Path
          
          COLOR_MAP = {
              'tatami': (0.70, 0.82, 0.60, 1.0),
              'engawa': (0.72, 0.60, 0.40, 1.0),
              'garden_ground': (0.84, 0.84, 0.80, 1.0),
              'stepping_stones': (0.34, 0.36, 0.35, 1.0),
              'kutsunugi': (0.42, 0.43, 0.40, 1.0),
              'stream': (0.35, 0.60, 0.85, 1.0),
              'mound': (0.42, 0.66, 0.38, 1.0),
              'maple': (0.82, 0.30, 0.22, 1.0),
              'pine': (0.20, 0.45, 0.20, 1.0),
              'tsukubai_kakei': (0.58, 0.54, 0.46, 1.0),
              'yotsume_gaki': (0.82, 0.68, 0.42, 1.0),
              'shiorido': (0.90, 0.74, 0.46, 1.0),
          }
          
          def parse_argv():
              argv = sys.argv
              if '--' in argv:
                  argv = argv[argv.index('--') + 1:]
              else:
                  argv = []
              ap = argparse.ArgumentParser()
              ap.add_argument('--source', required=True)
              ap.add_argument('--plan', required=True)
              ap.add_argument('--guardrail', required=True)
              ap.add_argument('--masks-dir', required=True)
              ap.add_argument('--outdir', required=True)
              return ap.parse_args(argv)
          
          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          def ensure(condition, msg):
              if not condition:
                  raise RuntimeError(msg)
          
          def clean_scene():
              bpy.ops.object.select_all(action='SELECT')
              bpy.ops.object.delete(use_global=False)
          
          def tex_node(nt, path, uv):
              tex = nt.nodes.new('ShaderNodeTexImage')
              tex.image = bpy.data.images.load(str(path), check_existing=True)
              tex.interpolation = 'Closest'
              nt.links.new(uv.outputs['UV'], tex.inputs['Vector'])
              return tex
          
          def source_material(name, source):
              m = bpy.data.materials.new(name)
              m.use_nodes = True
              nt = m.node_tree
              for n in list(nt.nodes): nt.nodes.remove(n)
              out = nt.nodes.new('ShaderNodeOutputMaterial')
              emis = nt.nodes.new('ShaderNodeEmission')
              uv = nt.nodes.new('ShaderNodeTexCoord')
              tex = tex_node(nt, source, uv)
              emis.inputs['Strength'].default_value = 1.0
              nt.links.new(tex.outputs['Color'], emis.inputs['Color'])
              nt.links.new(emis.outputs['Emission'], out.inputs['Surface'])
              return m
          
          def overlay_material(name, source, plan_data, masks_dir):
              m = bpy.data.materials.new(name)
              m.use_nodes = True
              nt = m.node_tree
              for n in list(nt.nodes): nt.nodes.remove(n)
              out = nt.nodes.new('ShaderNodeOutputMaterial')
              emis = nt.nodes.new('ShaderNodeEmission')
              emis.inputs['Strength'].default_value = 1.0
              uv = nt.nodes.new('ShaderNodeTexCoord')
              src = tex_node(nt, source, uv)
              previous = src.outputs['Color']
              for name2 in plan_data['order']:
                  mask_path = masks_dir / Path(plan_data['masks'][name2]['file']).name
                  mask_tex = tex_node(nt, mask_path, uv)
                  bw = nt.nodes.new('ShaderNodeRGBToBW')
                  mult = nt.nodes.new('ShaderNodeMath')
                  mult.operation = 'MULTIPLY'
                  mult.inputs[1].default_value = 0.45
                  mix = nt.nodes.new('ShaderNodeMixRGB')
                  mix.blend_type = 'MIX'
                  rgb = nt.nodes.new('ShaderNodeRGB')
                  rgb.outputs[0].default_value = COLOR_MAP.get(name2, (1.0, 0.2, 0.8, 1.0))
                  nt.links.new(mask_tex.outputs['Color'], bw.inputs['Color'])
                  nt.links.new(bw.outputs['Val'], mult.inputs[0])
                  nt.links.new(mult.outputs['Value'], mix.inputs['Fac'])
                  nt.links.new(previous, mix.inputs[1])
                  nt.links.new(rgb.outputs['Color'], mix.inputs[2])
                  previous = mix.outputs['Color']
              nt.links.new(previous, emis.inputs['Color'])
              nt.links.new(emis.outputs['Emission'], out.inputs['Surface'])
              return m
          
          def add_plane(width, height, material):
              bpy.ops.mesh.primitive_plane_add(size=2, location=(0, 0, 0))
              obj=bpy.context.object
              obj.name='V505_QA_PLANE'
              obj.scale=(width/2.0, height/2.0, 1.0)
              obj.data.materials.append(material)
              return obj
          
          def add_camera(view_height):
              data=bpy.data.cameras.new('QA_TOP')
              cam=bpy.data.objects.new('QA_TOP', data)
              bpy.context.collection.objects.link(cam)
              cam.location=(0,0,5)
              cam.rotation_euler=(0,0,0)
              data.type='ORTHO'
              data.ortho_scale=view_height
              return cam
          
          def set_render(scene, w, h, path):
              scene.render.engine='BLENDER_EEVEE_NEXT'
              scene.render.resolution_x=w
              scene.render.resolution_y=h
              scene.render.resolution_percentage=100
              scene.render.image_settings.file_format='PNG'
              scene.render.filepath=str(path)
              scene.render.film_transparent=False
              scene.world.color=(0.05,0.05,0.05)
          
          def main():
              args=parse_argv()
              source=Path(args.source).resolve()
              plan=Path(args.plan).resolve()
              guardrail=Path(args.guardrail).resolve()
              masks_dir=Path(args.masks_dir).resolve()
              outdir=Path(args.outdir).resolve()
              outdir.mkdir(parents=True, exist_ok=True)
              plan_data=json.loads(plan.read_text(encoding='utf-8'))
              json.loads(guardrail.read_text(encoding='utf-8'))
              ensure(sha256(source)==plan_data['source']['sha256'], 'source hash mismatch')
              for n,e in plan_data['masks'].items():
                  p=masks_dir/Path(e['file']).name
                  ensure(p.exists(), f'missing mask: {n}')
                  ensure(sha256(p)==e['sha256'], f'mask hash mismatch: {n}')
              clean_scene()
              w=int(plan_data['source']['width']); h=int(plan_data['source']['height'])
              ph=2.0; pw=ph*(w/h)
              srcmat=source_material('M_SOURCE', source)
              obj=add_plane(pw, ph, srcmat)
              scene=bpy.context.scene
              scene.camera=add_camera(pw)
              set_render(scene,w,h,outdir/'QA_v505_blender_top.png')
              bpy.ops.render.render(write_still=True)
              ovmat=overlay_material('M_OVERLAY', source, plan_data, masks_dir)
              obj.data.materials.clear(); obj.data.materials.append(ovmat)
              set_render(scene,w,h,outdir/'QA_v505_blender_overlay.png')
              bpy.ops.render.render(write_still=True)
              bpy.ops.wm.save_as_mainfile(filepath=str(outdir/'v505_stage1.blend'))
              receipt={
                'status':'PASS','schema':'v505-stage1-receipt-3.0','blender_version':bpy.app.version_string,
                'source_sha256':sha256(source),'plan_sha256':sha256(plan),'guardrail_sha256':sha256(guardrail),
                'render_dimensions':[w,h],'order':plan_data['order'],
                'outputs':['QA_v505_source_exact.png','QA_v505_mask_overlay_exact.png','QA_v505_blender_top.png','QA_v505_blender_overlay.png','v505_stage1.blend']
              }
              (outdir/'v505_stage1_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          
          if __name__=='__main__':
              main()
          PY
          python3 -m py_compile scripts/build_v505.py

      - name: Generate exact v505 QA plates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from PIL import Image
          import json, hashlib

          root = Path('.')
          out = root / 'out'
          out.mkdir(exist_ok=True)

          source_path = root / 'assets/v505.png'
          plan_path = root / 'assets/PLAN_LOCK.json'
          masks_dir = root / 'assets/masks'

          plan = json.loads(plan_path.read_text(encoding='utf-8'))

          def sha256(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1024*1024), b''):
                      h.update(b)
              return h.hexdigest()

          if sha256(source_path) != plan['source']['sha256']:
              raise SystemExit('SOURCE HASH MISMATCH')

          source = Image.open(source_path).convert('RGBA')
          source.save(out / 'QA_v505_source_exact.png')

          colors = {
              'tatami': (255, 0, 0),
              'engawa': (255, 128, 0),
              'garden_ground': (255, 230, 0),
              'stepping_stones': (0, 170, 255),
              'kutsunugi': (128, 0, 255),
              'stream': (0, 230, 255),
              'mound': (0, 200, 90),
              'maple': (255, 0, 180),
              'pine': (0, 110, 0),
              'tsukubai_kakei': (0, 0, 255),
              'yotsume_gaki': (150, 75, 0),
              'shiorido': (255, 255, 255),
          }

          overlay = source.copy()
          for name in plan['order']:
              entry = plan['masks'][name]
              mask_path = masks_dir / Path(entry['file']).name
              if sha256(mask_path) != entry['sha256']:
                  raise SystemExit(f'MASK HASH MISMATCH: {name}')
              mask = Image.open(mask_path).convert('L')
              # Official masks are grayscale L images; use their luminance as alpha.
              alpha = mask.point(lambda v: int(v * 0.52))
              r, g, b = colors[name]
              layer = Image.new('RGBA', source.size, (r, g, b, 0))
              layer.putalpha(alpha)
              overlay = Image.alpha_composite(overlay, layer)

          overlay.save(out / 'QA_v505_mask_overlay_exact.png')
          PYQA

      - name: Run v505 stage1 build
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1 --python scripts/build_v505.py -- --source assets/v505.png --plan assets/PLAN_LOCK.json --guardrail assets/guardrail_manifest.json --masks-dir assets/masks --outdir out

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s out/QA_v505_source_exact.png
          test -s out/QA_v505_mask_overlay_exact.png
          test -s out/QA_v505_blender_top.png
          test -s out/QA_v505_blender_overlay.png
          test -s out/v505_stage1_receipt.json
          test -s out/v505_stage1.blend
          grep -q '"status": "PASS"' out/v505_stage1_receipt.json
          file out/QA_v505_source_exact.png
          file out/QA_v505_mask_overlay_exact.png
          file out/QA_v505_blender_top.png
          file out/QA_v505_blender_overlay.png
          cat out/v505_stage1_receipt.json

