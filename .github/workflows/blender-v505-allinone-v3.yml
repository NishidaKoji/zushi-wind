name: Blender v505 stage1 QA (all-in-one v3)

on:
  workflow_dispatch:

jobs:
  v505_stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime library
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 python3-pil

      - name: Download Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          curl -fL -o blender.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.14.sha256
          EXPECTED=$(grep 'blender-4.5.14-linux-x64.tar.xz' blender.sha256 | awk '{print $1}')
          ACTUAL=$(sha256sum blender.tar.xz | awk '{print $1}')
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          tar -xf blender.tar.xz
          echo "$PWD/blender-4.5.14-linux-x64" >> "$GITHUB_PATH"

