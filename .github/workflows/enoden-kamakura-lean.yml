name: Kamakura lean timetable shortcut live verification
on:
  push:
    branches: [enoden-shortcut-build-20261021]
    paths:
      - 'enoden/kamakura-next-lean.cherri'
      - '.github/workflows/enoden-kamakura-lean.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign optimized watch shortcut
        shell: bash
        run: |
          set -euxo pipefail
          git init -q /tmp/cherri
          git -C /tmp/cherri remote add origin https://github.com/electrikmilk/cherri.git
          git -C /tmp/cherri fetch -q --depth 1 origin 7168fd0fb1c1b1ea9150cc078f82aada3d57174d
          git -C /tmp/cherri checkout -q --detach FETCH_HEAD
          cd /tmp/cherri
          go run . "$GITHUB_WORKSPACE/enoden/kamakura-next-lean.cherri" --debug --no-sign
      - name: Validate native action parameters and shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib,glob,json
          p=glob.glob('enoden/江ノ電 鎌倉駅 次発2本.plist')
          f=glob.glob('enoden/江ノ電 鎌倉駅 次発2本.shortcut')
          assert len(p)==len(f)==1,(p,f)
          b=open(f[0],'rb').read()
          print('SIGNED',b[:4],len(b))
          assert b[:4]==b'AEA1'
          d=plistlib.load(open(p[0],'rb'))
          a=d['WFWorkflowActions']
          print('ACTIONS',len(a),'TYPES',d.get('WFWorkflowTypes'))
          assert 'Watch' in d.get('WFWorkflowTypes',[])
          assert a[0]['WFWorkflowActionIdentifier']=='is.workflow.actions.downloadurl'
          assert a[0]['WFWorkflowActionParameters']['WFURL']=='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          cond=[]
          for i,x in enumerate(a):
              pp=x.get('WFWorkflowActionParameters',{})
              if x['WFWorkflowActionIdentifier']=='is.workflow.actions.conditional' and pp.get('WFControlFlowMode')==0:
                  op=pp.get('WFCondition')
                  cond.append(op)
                  print('IF',i,op,pp.keys())
                  assert op!=99, 'Bad contains with missing UI field'
                  if op in (0,1,2,3,4,5):
                      assert 'WFNumberValue' in pp,('Numeric IF missing value',i,pp)
                      assert 'WFConditionalActionString' not in pp
                  elif op==100: assert 'WFInput' in pp
                  else: raise AssertionError(('Unexpected IF',i,pp))
          print('IF_OPERATOR_LIST',cond)
          assert len(cond)>=10
          ids=[x['WFWorkflowActionIdentifier'] for x in a]
          assert 'is.workflow.actions.setitemname' in ids
          assert 'is.workflow.actions.detect.text' in ids
          assert ids.count('is.workflow.actions.repeat.each')==4,[(i,n) for i,n in enumerate(ids) if 'repeat' in n]
          assert len(a)<210,('Unexpected number of compiled actions',len(a))
          texts=[x.get('WFWorkflowActionParameters',{}).get('Text') for x in a if x['WFWorkflowActionIdentifier']=='is.workflow.actions.showresult']
          assert len(texts)==2
          body=json.dumps(texts,ensure_ascii=False)
          assert '江ノ電 鎌倉駅' in body
          assert '次発2本 v6' not in body
          splits=[x.get('WFWorkflowActionParameters',{}) for x in a if x['WFWorkflowActionIdentifier']=='is.workflow.actions.text.split']
          assert len(splits)>=3
          dynamic=[x for x in splits if x.get('WFTextCustomSeparator',{}).__class__!=str]
          print('DYNAMIC_SEPARATOR_ACTIONS',len(dynamic))
          for pp in splits: print('SPLIT_PARAM',str(pp)[:400])
          assert len(dynamic)>=1,'No dynamic current-hour split separator'
          assert ids.count('is.workflow.actions.getitemfromlist')>=3
          print('STATIC_SHORTCUT_CHECK_PASS')
          PY
      - name: Verify live site regex, minute markers, full-day correctness and bounded scanning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.request,datetime
          url='https://www.enoden.co.jp/train/station/kamakura/time-table/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          page=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          row_marker='<div class="time-schedule-row">'
          regex=r'<div class="time-schedule-minute">[^<]*(?:<p class="num cap">[江極稲]</p>[^<]*)?<p class="num">([0-9]{1,2})</p>'
          rows=page.split(row_marker)
          full=[]
          for row in rows:
              hh=re.search(r'time-schedule-td-hour">([0-9]{1,2})',row)
              if not hh:continue
              h=int(hh.group(1))
              for cell in re.finditer(regex,row):
                  m=int(cell.group(1))
                  dest='藤沢行'
                  if '<p class="num cap">江</p>' in cell.group(0):dest='江ノ島行'
                  if '<p class="num cap">極</p>' in cell.group(0):dest='極楽寺行'
                  if '<p class="num cap">稲</p>' in cell.group(0):dest='稲村ヶ崎行'
                  full.append((h*60+m,dest))
          assert len(full)>=60,len(full)
          assert all(a[0]<=b[0] for a,b in zip(full,full[1:])), 'Not chronological'
          print('OFFICIAL_DEPARTURES',len(full),'BYTES',len(page),'FIRST',full[0],'LAST',full[-1])
          first_match=re.search(r'time-schedule-td-hour">([0-9]{1,2})',page)
          first_hour=int(first_match.group(1))
          assert first_hour>=0
          def fast(now):
              hh=now//60
              marker=f'time-schedule-td-hour">{hh}</div>'
              segments=page.split(marker)
              current=page
              if hh>=first_hour and len(segments)>1:
                  current=marker+segments[-1]
              combined=current+row_marker+'ENODEN_TOMORROW'+page
              found=[]
              tomorrow=False
              rows_visited=0
              services_checked=0
              for row in combined.split(row_marker):
                  if len(found)>=2:break
                  if 'ENODEN_TOMORROW' in row:tomorrow=True
                  hour=re.search(r'time-schedule-td-hour">([0-9]{1,2})',row)
                  if not hour:continue
                  rows_visited+=1
                  h=int(hour.group(1))
                  for cell in re.finditer(regex,row):
                      if len(found)>=2:break
                      services_checked+=1
                      m=int(cell.group(1))
                      dep=h*60+m
                      remaining=dep-now+(1440 if tomorrow else 0)
                      if remaining<=0:continue
                      d='藤沢行'
                      if '<p class="num cap">江</p>' in cell.group(0): d='江ノ島行'
                      if '<p class="num cap">極</p>' in cell.group(0): d='極楽寺行'
                      if '<p class="num cap">稲</p>' in cell.group(0): d='稲村ヶ崎行'
                      found.append((remaining,dep,d))
              return found,rows_visited,services_checked
          row_max=0
          svc_max=0
          for now in range(1440):
              result,rows_checked,services_checked=fast(now)
              truth=sorted(((((t-now)%1440 or 1440),t,d) for t,d in full))[:2]
              if result!=truth:raise AssertionError(f'{now//60:02}:{now%60:02} actual={result} expected={truth}')
              row_max=max(rows_checked,row_max)
              svc_max=max(services_checked,svc_max)
          print('ALL_1440_MINUTES_PASS','WORST_ROWS',row_max,'WORST_SERVICES',svc_max)
          assert row_max<=6,('Too many row inspections',row_max)
          assert svc_max<=10,('Too many minute checks',svc_max)
          for hh,mm in [(0,1),(5,19),(12,38),(17,59),(22,59),(23,40)]:
              print('SAMPLE',f'{hh:02}:{mm:02}',fast(hh*60+mm))
          PY
      - name: Publish signed file only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin enoden-shortcut-build-20261021
          git checkout -B enoden-shortcut-build-20261021 origin/enoden-shortcut-build-20261021
          git add -f "enoden/江ノ電 鎌倉駅 次発2本.shortcut"
          git commit -m "Publish optimized native Kamakura next-two shortcut [skip ci]"
          git push origin HEAD:enoden-shortcut-build-20261021
          echo "OPTIMIZED_SIGNED_SHORTCUT_PUBLISHED=true"
