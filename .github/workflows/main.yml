name: Update Zushi wind

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: zushi-wind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Install OCR and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr

      - name: Read and publish wind
        id: wind
        continue-on-error: true
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "YOUTUBE_COOKIES_B64 secret is not configured" >&2
            exit 1
          fi
          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$COOKIE_FILE"
          chmod 600 "$COOKIE_FILE"
          YOUTUBE_COOKIES_FILE="$COOKIE_FILE" python generate_cloud.py

      - name: Check 30 minute failure state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          STATE_DIR=".github/wind-monitor"
          STATE_FILE="$STATE_DIR/state.txt"
          mkdir -p "$STATE_DIR"

          START=0
          ISSUE=0

          if [ -f "$STATE_FILE" ]; then
            read -r START ISSUE < "$STATE_FILE" || true
          fi

          NOW=$(date +%s)

          if [ "${{ steps.wind.outcome }}" = "success" ]; then
            if [ "${ISSUE:-0}" != "0" ]; then
              gh issue close "$ISSUE" --comment "@NishidaKoji 逗子マリーナ風速取得が復旧しました。"
            fi
            echo "0 0" > "$STATE_FILE"
          else
            if [ "${START:-0}" = "0" ]; then
              START=$NOW
            fi

            ELAPSED=$((NOW - START))

            if [ "$ELAPSED" -ge 1800 ] && [ "${ISSUE:-0}" = "0" ]; then
              URL=$(gh issue create --title "逗子マリーナ風速取得が30分以上停止" --body "@NishidaKoji 逗子マリーナの風速取得が30分以上連続して失敗しています。GitHub Actions の Update Zushi wind を確認してください。障害継続中は通知を繰り返さず、復旧時にこのIssueを自動で閉じます。")
              ISSUE="${URL##*/}"
            fi

            echo "$START ${ISSUE:-0}" > "$STATE_FILE"
          fi

      - name: Save monitor state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/wind-monitor/state.txt
          git diff --cached --quiet || git commit -m "Update wind monitor state"
          git push

      - name: Publish failure status
        if: steps.wind.outcome != 'success'
        run: |
          python - <<'PY'
          import html, json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root = Path(".")
          latest = "不明"
          try:
              data = json.loads((root / "wind.json").read_text(encoding="utf-8"))
              latest = datetime.fromtimestamp(int(data["ts"]), ZoneInfo("Asia/Tokyo")).strftime("%m/%d %H:%M")
          except (OSError, KeyError, ValueError, TypeError, OverflowError):
              pass
          body = f"逗子マリーナ\\n風速データ取得停止中\\n最終取得 {latest}\\n現在の風速は確認できません"
          (root / "watch.txt").write_text(body + "\\n", encoding="utf-8")
          (root / "index.html").write_text(
              "<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width'>"
              "<title>逗子マリーナ風速</title><style>body{font:22px system-ui;white-space:pre-line;"
              "padding:24px;line-height:1.7}</style>" + html.escape(body), encoding="utf-8")
          print(body)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.txt index.html
          git diff --cached --quiet || git commit -m "Show failure rather than stale wind reading"
          git push

      - name: Save latest reading
        if: steps.wind.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.txt wind.json index.html
          git diff --cached --quiet || git commit -m "Update wind reading"
          git push
