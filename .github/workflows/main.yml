name: Update Zushi wind

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zushi-wind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr
          python -m pip install --disable-pip-version-check -q -U yt-dlp

      - name: Read and publish wind
        run: python generate_cloud.py

      - name: Save latest reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.txt wind.json index.html
          git diff --cached --quiet || git commit -m "Update wind reading"
          git push
