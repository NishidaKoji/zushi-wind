name: Update Zushi wind

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zushi-wind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr

      - name: Read and publish wind
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "YOUTUBE_COOKIES_B64 secret is not configured" >&2
            exit 1
          fi
          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$COOKIE_FILE"
          chmod 600 "$COOKIE_FILE"
          YOUTUBE_COOKIES_FILE="$COOKIE_FILE" python generate_cloud.py

      - name: Save latest reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.txt wind.json index.html
          git diff --cached --quiet || git commit -m "Update wind reading"
          git push
